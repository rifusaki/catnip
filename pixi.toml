[workspace]
authors = ["rifusaki <martina@rifusaki.com>"]
channels = ["conda-forge", "pytorch"]
name = "catnip"
platforms = ["osx-arm64", "linux-64"]
version = "0.2.0"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/xpu"]

[dependencies]
python = "3.11.*"
numpy = "<2"
ipykernel = ">=6.30.1,<7"
scikit-learn = ">=1.7.2,<2"
matplotlib = ">=3.10.6,<4"
ultralytics = ">=8.4.66,<9"
pydantic = ">=2.11.9,<3"
pydantic-settings = ">=2.11.0,<3"
omegaconf = ">=2.3.0,<3"
sahi = ">=0.11.36,<0.13"
requests = ">=2.34.2,<3"
python-dotenv = ">=1.2.2,<2"

[pypi-dependencies]
torchsummary = ">=1.5.1, <2"
opencv-python = ">=4.10.0,<5"
manga109api = ">=0.3.1, <0.4"

# home server running on WSL
[target.linux-64.pypi-dependencies]
# Install PyTorch with XPU support - IPEX is no longer needed for PyTorch 2.6+
# as Intel XPU support is now integrated into PyTorch itself
torch = "==2.6.0+xpu"
torchvision = "==0.21.0+xpu"
torchaudio = "==2.6.0+xpu"

# dev machine
[target.osx-arm64.dependencies]
# macOS uses conda PyTorch (no Intel XPU)
pytorch = "==2.4.1"
torchvision = "==0.19.1"

# ---------------------------------------------------------------------------
# Optional feature: kagglehub for sync/publish scripts.
#
# Activate with:  pixi run -e kaggle kaggle-sync
# Auth: set KAGGLE_API_TOKEN in .env or env var
# ---------------------------------------------------------------------------
[feature.kaggle.pypi-dependencies]
kagglehub = ">=0.3,<1"

[environments]
# kaggle env stacks the default deps + the kaggle feature.  Used by the
# kaggle-sync / kaggle-publish tasks.  Training and inference stay in
# the default env.
kaggle = ["kaggle"]

# ---------------------------------------------------------------------------
# Tasks
#
# Conventions:
#   * all paths are relative to the project root (pixi runs tasks there)
#   * pass-through args: `pixi run <task> -- <extra args>` appends to cmd
#   * `kaggle-*` tasks require `-e kaggle` (kaggle/kagglehub not in default)
# ---------------------------------------------------------------------------
[tasks]
# --- Unify pipeline (data prep, runs on the dev machine) ---
# Pass-through: `pixi run <task> -- <extra args>` appends to the cmd.
unify-izutsumi  = "python scripts/unify/izutsumi.py"
unify-manga109  = "python scripts/unify/manga109.py"
unify-coco-heads = "python scripts/unify/coco_heads.py --input-dir catnip-data/data/AnimeHeadsv3 --output-dir catnip-data/data/staging/ah_coco"
unify-yolo-heads = "python scripts/unify/yolo_heads.py"
unify-stage1    = "python scripts/unify/stage1.py --slice --slice-workers 4"

# Convenience: full data-prep pipeline (unify + slice).  No command of its
# own — `depends-on` runs each task in order.
data-prep = { depends-on = [
    "unify-izutsumi",
    "unify-manga109",
    "unify-coco-heads",
    "unify-yolo-heads",
    "unify-stage1",
] }

# --- Training (runs in pixi env; device selected via config/CLI) ---
train-stage1 = "python scripts/train/stage1.py"
train-stage2 = "python scripts/train/stage2.py"

# --- GCS bucket hygiene ---
reorganize-gcs = "python scripts/reorganize_gcs.py"

# --- Kaggle sync (local/GCS/R2 → Kaggle dataset version) ---
# Requires the kaggle env + KAGGLE_API_TOKEN:  pixi run -e kaggle kaggle-sync
kaggle-sync = "python scripts/kaggle_sync.py"

# --- Kaggle publish (notebook session → catnip-stage1-output dataset) ---
# This is what the third cell of notebooks/catnipKaggle.ipynb calls.
# Locally:  pixi run -e kaggle kaggle-publish -- --output-dir ...
kaggle-publish = "python scripts/kaggle_publish.py"
